services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderiza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenderiza
      POSTGRES_PASSWORD: tenderiza
      POSTGRES_DB: tenderiza
    ports:
      - "5432:5432"
    volumes:
      - tenderiza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderiza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tenderiza_pgdata:
